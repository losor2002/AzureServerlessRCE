name: Build and Push Docker Worker to ACR

on:
  push:
    branches:
      - main
    paths:
      - 'Docker/**'
      - '.github/workflows/docker-build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Login su Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dell'immagine
        uses: docker/build-push-action@v5
        with:
          context: ./Docker
          push: true
          # Tagga l'immagine col nome del tuo server ACR
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/compilatore-cloud:v1